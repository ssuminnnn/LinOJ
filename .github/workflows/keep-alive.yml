name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 0 */3 * *'  # 3일마다 한 번
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # 백엔드 /api/health 가 DB를 조회하므로 Supabase 활동으로 잡힌다.
      # Render가 잠들어 있으면 깨어나는 데 시간이 걸려서 넉넉히 기다리며 재시도한다.
      - name: Ping backend (and DB)
        run: |
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 \
            "https://api.linoj.online/api/health"
